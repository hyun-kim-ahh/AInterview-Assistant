[project]
name = "interview-assistant"
version = "0.1.0"
description = "전문가 인터뷰 어시스턴트 (개인용 로컬)"
requires-python = ">=3.11"
dependencies = [
    # 8단계: LLM 호출 — OpenRouter를 openai SDK(base_url 오버라이드)로 사용
    "openai>=2.48.0",
    "python-dotenv>=1.2.2",
    # 10단계: 최소 UI — localhost 웹 UI (서버 렌더링, AJAX/SPA 없음)
    "flask>=3.1.3",
    # 15단계: STT 벤더 비교(Deepgram/Naver Clova Speech/OpenAI/AssemblyAI)
    "deepgram-sdk>=7.6.0",
    "assemblyai>=0.35.0",
    "requests>=2.32.0",
    # 15단계 Milestone 3: 실시간 마이크 캡처(Deepgram으로 벤더 확정)
    "sounddevice>=0.5.1",
    "numpy>=2.0.0",  # sounddevice의 콜백 기반 InputStream이 내부적으로 필요로 함
    "certifi>=2025.1.31",  # websockets용 SSL 인증서 번들(macOS python.org 설치본 대응)
    # 인터뷰 종료 시 종합 정리 문서를 실제 마크다운(표/헤딩/목록)으로 작성 후 HTML로 렌더링
    "markdown>=3.7",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
